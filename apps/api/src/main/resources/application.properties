spring.application.name=amphi

# SQLite datasource
spring.datasource.url=jdbc:sqlite:./data/amphi.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Ensure foreign keys are enforced in SQLite (also set via connection init if needed)
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# JWT (dev default - override in production)
app.jwt.secret=change-this-secret-key-for-dev-only-change-me-please-32chars
app.jwt.expiration-ms=86400000

server.port=8080

# Optional local config for admin bootstrap command (email/password), env-style KEY=VALUE or properties
# Includes repo root .env so `pnpm create-admin` from root can supply credentials
spring.config.import=optional:file:../../.env[.properties],optional:file:./admin.properties,optional:file:./.env[.properties]

# Admin bootstrap (used by: ./gradlew createAdmin or pnpm create-admin)
app.admin.enabled=false
app.admin.email=
app.admin.username=
app.admin.password=
app.admin.first-name=Admin
app.admin.last-name=User
