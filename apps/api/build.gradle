plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.matta'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

	implementation 'org.xerial:sqlite-jdbc:3.51.3.0'
	implementation 'org.hibernate.orm:hibernate-community-dialects'

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('createAdmin', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Create or update an admin user from admin.properties/.env or -PadminEmail/-PadminPassword (username = email)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'me.matta.amphi.AmphiApplication'

	def adminArgs = [
		'--spring.main.web-application-type=none',
		'--spring.main.lazy-initialization=true',
		'--app.admin.enabled=true'
	]
	if (project.hasProperty('adminEmail')) {
		adminArgs.add("--app.admin.email=${project.property('adminEmail')}")
	}
	if (project.hasProperty('adminUsername')) {
		adminArgs.add("--app.admin.username=${project.property('adminUsername')}")
	}
	if (project.hasProperty('adminPassword')) {
		adminArgs.add("--app.admin.password=${project.property('adminPassword')}")
	}
	if (project.hasProperty('adminFirstName')) {
		adminArgs.add("--app.admin.first-name=${project.property('adminFirstName')}")
	}
	if (project.hasProperty('adminLastName')) {
		adminArgs.add("--app.admin.last-name=${project.property('adminLastName')}")
	}
	args = adminArgs
}
